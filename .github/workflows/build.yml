name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with script
        run: ./build.sh

      - name: Align, Sign and Package APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          
          RAW_APK=$(find out -name "*.apk" | head -n 1)
          
          zipalign -v -p 4 "$RAW_APK" aligned-unfixed.apk
          
          apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android aligned-unfixed.apk
          
          cp aligned-unfixed.apk FreeMyTV-Ready.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Ready
          path: FreeMyTV-Ready.apk
