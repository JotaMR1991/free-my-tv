name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: ./build.sh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-APK
          path: out/*.apk
