name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with script
        run: ./build.sh

      - name: Align and Sign APK properly
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          
          RAW_APK=$(find out -name "*.apk" | head -n 1)
          
          # Alinhamento obrigatório exigido pelo Android moderno da TV
          zipalign -v -p 4 "$RAW_APK" aligned.apk
          
          # Assinatura com a keystore gerada
          jarsigner -keystore debug.keystore -storepass android -keypass android aligned.apk androiddebugkey
          
          cp aligned.apk FreeMyTV-Ready.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Ready
          path: FreeMyTV-Ready.apk
